<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Placeholders</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }
    .placeholder {
      width: 600px;
      height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .data-science {
      background: linear-gradient(135deg, #4a4eff, #7000ff);
    }
    .ai-agent {
      background: linear-gradient(135deg, #00b894, #00cec9);
    }
    .game-dev {
      background: linear-gradient(135deg, #ff7675, #fd79a8);
    }
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .subtitle {
      font-size: 24px;
      margin-bottom: 40px;
      opacity: 0.8;
    }
    .screenshot {
      width: 80%;
      height: 200px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="placeholder data-science">
    <div class="logo">2Truth_and_a_Lie</div>
    <div class="subtitle">Data Science Project</div>
    <div class="screenshot">ML Analysis Visualization</div>
  </div>
  
  <div class="placeholder ai-agent">
    <div class="logo">AI Agent</div>
    <div class="subtitle">Intelligent Autonomous System</div>
    <div class="screenshot">Agent Interface</div>
  </div>
  
  <div class="placeholder game-dev">
    <div class="logo">Fish4Future</div>
    <div class="subtitle">Educational Game Development</div>
    <div class="screenshot">Game Screenshot</div>
  </div>
</body>
</html>
