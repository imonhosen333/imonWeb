<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Imon Hosen</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <img src="img/logo/imon's.png" alt="Logo" class="sidebar-logo">
                <h2>Admin Panel</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active">
                        <a href="#dashboard"><i class="fas fa-home"></i> Dashboard</a>
                    </li>
                    <li>
                        <a href="#new-post"><i class="fas fa-plus-circle"></i> New Post</a>
                    </li>
                    <li>
                        <a href="#manage-posts"><i class="fas fa-file-alt"></i> Manage Posts</a>
                    </li>
                    <li>
                        <a href="#categories"><i class="fas fa-tags"></i> Categories</a>
                    </li>
                    <li>
                        <a href="#analytics"><i class="fas fa-chart-bar"></i> Analytics</a>
                    </li>
                    <li>
                        <a href="#settings"><i class="fas fa-cog"></i> Settings</a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Top Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button id="sidebarToggle" class="sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Dashboard</h1>
                </div>
                <div class="header-right">
                    <div class="admin-profile">
                        <img src="img/logo/imon's.png" alt="Profile" class="profile-img">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="admin-content">
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Posts</h3>
                            <p id="totalPosts">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-eye"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Views</h3>
                            <p id="totalViews">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-tags"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Categories</h3>
                            <p id="totalCategories">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <i class="fas fa-comments"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Comments</h3>
                            <p id="totalComments">0</p>
                        </div>
                    </div>
                </div>

                <!-- New Post Form -->
                <div class="content-section" id="new-post-section">
                    <div class="section-header">
                        <h2>Create New Post</h2>
                        <button class="toggle-form-btn">
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                    <form id="blogForm" class="blog-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="blogTitle">Title</label>
                                <input type="text" id="blogTitle" required placeholder="Enter post title">
                            </div>
                            <div class="form-group">
                                <label for="blogCategory">Category</label>
                                <select id="blogCategory" required>
                                    <!-- Categories will be populated by JavaScript -->
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="blogImage">Featured Image</label>
                                <div class="image-upload-container">
                                    <input type="file" id="blogImageFile" accept="image/*" class="image-file-input">
                                    <div class="image-upload-preview">
                                        <img id="imagePreview" src="#" alt="Preview" style="display: none;">
                                    </div>
                                    <input type="url" id="blogImage" placeholder="Or enter image URL">
                                </div>
                            </div>
                            <div class="form-group full-width">
                                <label for="blogContent">Content</label>
                                <textarea id="blogContent" rows="10" required placeholder="Write your blog content here..."></textarea>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="submit-btn">
                                <i class="fas fa-paper-plane"></i> Publish Post
                            </button>
                            <button type="button" class="draft-btn">
                                <i class="fas fa-save"></i> Save as Draft
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Manage Posts Table -->
                <div class="content-section" id="manage-posts-section">
                    <div class="section-header">
                        <h2>Manage Posts</h2>
                        <div class="table-actions">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" placeholder="Search posts...">
                            </div>
                            <select class="filter-select">
                                <option value="all">All Posts</option>
                                <option value="published">Published</option>
                                <option value="drafts">Drafts</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="blog-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Views</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="blogTable">
                                <!-- Blog posts will be populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Post Modal -->
    <div id="editPostModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Post</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="editPostForm" class="blog-form">
                <input type="hidden" id="editPostId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editBlogTitle">Title</label>
                        <input type="text" id="editBlogTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="editBlogCategory">Category</label>
                        <select id="editBlogCategory" required>
                            <!-- Categories will be populated by JavaScript -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editBlogImage">Featured Image</label>
                        <div class="image-upload-container">
                            <input type="file" id="editBlogImageFile" accept="image/*" class="image-file-input">
                            <div class="image-upload-preview">
                                <img id="editImagePreview" src="#" alt="Preview" style="display: none;">
                            </div>
                            <input type="url" id="editBlogImage" placeholder="Or enter image URL">
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label for="editBlogContent">Content</label>
                        <textarea id="editBlogContent" rows="10" required></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">
                        <i class="fas fa-save"></i> Update Post
                    </button>
                    <button type="button" class="cancel-btn">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin-dashboard.js"></script>
</body>
</html>
